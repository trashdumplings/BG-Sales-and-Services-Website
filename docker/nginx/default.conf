server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self'; connect-src 'self' https: wss: http://localhost:8000 http://127.0.0.1:8000; manifest-src 'self'; worker-src 'self' blob:" always;

    # This container serves only the SPA. Do not make backend or sensitive-looking
    # paths appear valid through the index.html fallback.
    location ~ ^/(?:api|auth|admin|uploads)(?:/|$) {
        return 404;
    }

    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    location ~* \.(?:map|env|ini|log|sql|bak|old)$ {
        return 404;
    }

    location = /robots.txt {
        return 404;
    }

    location = /sitemap.xml {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        add_header Content-Type text/plain;
        add_header X-Content-Type-Options "nosniff" always;
        return 200 "ok";
    }
}
