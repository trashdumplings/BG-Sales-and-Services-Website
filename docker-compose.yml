services:
  postgres:
    image: postgres:16
    container_name: bgsale-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bgsale_portal}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      # Bound to loopback only: Postgres must never be reachable from outside this host.
      # For local dev tools (psql/pgAdmin) this still works via localhost; for a remote
      # box, use an SSH tunnel (ssh -L 5432:localhost:5432 user@host) instead of opening it up.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bgsale_portal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  dbadmin:
    image: dpage/pgadmin4:latest
    container_name: bgsale-dbadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@bgsales.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in your .env file}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      PGADMIN_CONFIG_LOGIN_BANNER: "'BG Sale DB Admin'"
    ports:
      # Bound to loopback only, same reasoning as postgres above.
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  core:
    build:
      context: .
      dockerfile: services/backend/server/Dockerfile
    container_name: bgsale-core
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DEBUG: ${APP_DEBUG:-true}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file (e.g. openssl rand -base64 48)}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      REFRESH_TOKEN_REMEMBER_DAYS: ${REFRESH_TOKEN_REMEMBER_DAYS:-30}
      REFRESH_TOKEN_SESSION_HOURS: ${REFRESH_TOKEN_SESSION_HOURS:-8}
      SESSION_IDLE_TIMEOUT_MINUTES: ${SESSION_IDLE_TIMEOUT_MINUTES:-30}
      ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION:-true}
      AUTO_CREATE_TABLES: ${AUTO_CREATE_TABLES:-true}
      ENFORCE_HTTPS: ${ENFORCE_HTTPS:-false}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1,bgsale-core}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-bgsale_portal}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3002,http://127.0.0.1:3002,http://localhost:8080,http://127.0.0.1:8080}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      EMAIL_FROM: ${EMAIL_FROM:-}
      INVENTORY_ALERT_EMAIL: ${INVENTORY_ALERT_EMAIL:-}
      PRODUCT_UPLOAD_DIR: /app/uploads
    ports:
      # Development API is local-only. Production exposes it exclusively through Caddy.
      - "127.0.0.1:${CORE_PORT:-8000}:8000"
    volumes:
      - product_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
        VITE_ALLOW_PUBLIC_REGISTRATION: ${VITE_ALLOW_PUBLIC_REGISTRATION:-true}
    container_name: bgsale-frontend
    restart: unless-stopped
    depends_on:
      core:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3002}:80"

volumes:
  postgres_data:
  pgadmin_data:
  product_uploads:
