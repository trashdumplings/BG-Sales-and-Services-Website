name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:all
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/backend/server/requirements.txt
      - run: pip install -r services/backend/server/requirements.txt pytest
      - run: pytest services/backend/server/tests

  production-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create validation-only secret files
        run: |
          mkdir secrets
          touch secrets/postgres_password secrets/pgadmin_password secrets/jwt_secret secrets/smtp_password
      - name: Validate production Compose configuration
        env:
          POSTGRES_DB: bgsale
          POSTGRES_USER: bgsale
          PGADMIN_DEFAULT_EMAIL: admin@example.com
          DOMAIN: example.com
          ACME_EMAIL: admin@example.com
          TRUSTED_HOSTS: example.com,api.example.com
          CORS_ORIGINS: https://example.com
          VITE_API_BASE: https://api.example.com
        run: docker compose -f docker-compose.prod.yml config --quiet
