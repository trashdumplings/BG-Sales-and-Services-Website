name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm run lint
      - run: npm run test:all
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/backend/server/requirements.txt
      - run: pip install -r services/backend/server/requirements.txt pytest pip-audit
      - run: pip-audit -r services/backend/server/requirements.txt
      - run: pytest services/backend/server/tests

  production-compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: bgsale_ci
      POSTGRES_USER: bgsale_ci
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      DOMAIN: example.com
      ACME_EMAIL: admin@example.com
      TRUSTED_HOSTS: example.com,www.example.com,api.example.com
      CORS_ORIGINS: https://example.com,https://www.example.com
      VITE_API_BASE: https://api.example.com
      AUTO_CREATE_TABLES: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Create validation-only secret files
        run: |
          mkdir secrets
          printf '%s' 'CI-Database-p@ss:/#%%word-2026' > secrets/postgres_password
          printf '%s' 'CI-pgAdmin-password-2026' > secrets/pgadmin_password
          printf '%s' 'ci-jwt-secret-with-at-least-sixty-four-random-looking-characters-2026' > secrets/jwt_secret
          touch secrets/smtp_password
      - name: Validate production Compose configuration
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Smoke test fresh database migrations and readiness
        run: |
          docker compose -f docker-compose.prod.yml up -d --build postgres migrate core frontend
          docker compose -f docker-compose.prod.yml exec -T core python -c "import os,urllib.request; request=urllib.request.Request('http://127.0.0.1:8000/ready',headers={'Host':os.environ['HEALTHCHECK_HOST']}); print(urllib.request.urlopen(request).read().decode())"
          test "$(docker compose -f docker-compose.prod.yml exec -T postgres psql -U bgsale_ci -d bgsale_ci -tAc 'select version_num from alembic_version')" = "20260820_0007"
      - name: Show production logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --no-color --tail=200
      - name: Remove CI stack
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v --remove-orphans
